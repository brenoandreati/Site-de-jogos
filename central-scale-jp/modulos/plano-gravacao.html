<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plano de Gravação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* =====================================================================
   Plano de Gravação · Central Scale & JP
   Reels a gravar numa janela de datas, agrupados pelo cenário que precisa
   ser montado. Datas e horários vêm do Calendário de Posts; gancho, direção
   e roteiro vêm da Central Scale e da Central do JP (pasta dados/).
   Cores do Scale Design System: azul #0B2A8A, royal #1B4FBF, ouro #C9A24D,
   JP #16294A. Funil igual ao Calendário (topo, meio, fundo).
   ===================================================================== */
:root{
  --bg:#F4F1EC; --surface:#FFFFFF; --surface-2:#FAF8F5; --soft:#EFEAE1; --ink:#14192A; --muted:#5E6577; --faint:#8D93A1;
  --line:#E4DED3; --line-2:#EEE9E1;
  --head:#0F1E3A; --head-ink:#FFFFFF; --head-muted:rgba(255,255,255,.68); --head-line:rgba(255,255,255,.12);
  --gold:#C9A24D; --gold-ink:#7D5F18; --accent:#0B2A8A; --on-accent:#FFFFFF;
  --int:#1B4FBF; --int-soft:#E6EDFB; --ext:#A9822C; --ext-soft:#F6EDDA;
  --topo:#2670C4; --topo-soft:#E4EEFA; --topo-ink:#1A57A0;
  --meio:#C9A24D; --meio-soft:#F6EDDA; --meio-ink:#6E5310;
  --fundo:#0B2A8A; --fundo-soft:#E5EAF8; --fundo-ink:#0B2A8A;
  --both:#5B2FC0; --both-soft:#EFE8FA;
  --ok:#1F7A4D; --ok-soft:#EAF5EF; --ok-bar:#6FD3A0;
  --warn-bg:#FFF4D6; --warn-fg:#5A4306;
  --shadow:0 1px 2px rgba(20,25,42,.04),0 8px 22px rgba(20,25,42,.06);
  --f-ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --f-display:"Fraunces",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1018; --surface:#151A26; --surface-2:#121620; --soft:#1C2231; --ink:#ECEEF3; --muted:#A2AABA; --faint:#717989;
    --line:#262D3C; --line-2:#1E2431;
    --head:#0A0D14; --head-line:rgba(255,255,255,.08);
    --gold:#D9B766; --gold-ink:#D9B766; --accent:#9DB4F5; --on-accent:#0D1018;
    --int:#8DAAF5; --int-soft:#1A2547; --ext:#D9B766; --ext-soft:#2E2819;
    --topo:#5AA6F0; --topo-soft:#16293F; --topo-ink:#9CCBF7;
    --meio:#D4B25C; --meio-soft:#2E2819; --meio-ink:#E8CF8E;
    --fundo:#8EA6F2; --fundo-soft:#1A2547; --fundo-ink:#B4C4F7;
    --both:#C7AEF7; --both-soft:#2A2142;
    --ok:#6FD3A0; --ok-soft:#14291F;
    --warn-bg:#2B2410; --warn-fg:#EBD79A;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1018; --surface:#151A26; --surface-2:#121620; --soft:#1C2231; --ink:#ECEEF3; --muted:#A2AABA; --faint:#717989;
  --line:#262D3C; --line-2:#1E2431;
  --head:#0A0D14; --head-line:rgba(255,255,255,.08);
  --gold:#D9B766; --gold-ink:#D9B766; --accent:#9DB4F5; --on-accent:#0D1018;
  --int:#8DAAF5; --int-soft:#1A2547; --ext:#D9B766; --ext-soft:#2E2819;
  --topo:#5AA6F0; --topo-soft:#16293F; --topo-ink:#9CCBF7;
  --meio:#D4B25C; --meio-soft:#2E2819; --meio-ink:#E8CF8E;
  --fundo:#8EA6F2; --fundo-soft:#1A2547; --fundo-ink:#B4C4F7;
  --both:#C7AEF7; --both-soft:#2A2142;
  --ok:#6FD3A0; --ok-soft:#14291F;
  --warn-bg:#2B2410; --warn-fg:#EBD79A;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.3);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- topo ---------- */
.hd{background:var(--head);color:var(--head-ink);padding-top:calc(18px + env(safe-area-inset-top,0px))}
.hd .wrap{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;padding-bottom:16px}
.eyebrow{margin:0;font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.hd h1{margin:4px 0 4px;font-family:var(--f-display);font-weight:600;font-size:clamp(22px,5.4vw,30px);line-height:1.12;letter-spacing:-.01em;text-wrap:balance}
.hd .sub{margin:0;font-size:13px;color:var(--head-muted)}
.prog{min-width:150px;flex:0 0 auto;text-align:right}
.prog .num{font-size:13px;color:var(--head-muted)}
.prog .num b{font-size:26px;font-weight:700;color:var(--head-ink);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.prog .num span{font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:var(--ok-bar);border-radius:99px;transition:width .35s ease}
@media (max-width:520px){.prog{text-align:left;width:100%}}

.tabs{position:sticky;top:0;z-index:20;background:var(--head);border-top:1px solid var(--head-line);box-shadow:0 6px 18px rgba(10,14,25,.12)}
.tabs .wrap{display:flex;gap:2px}
.tab{flex:1 1 auto;min-width:0;border:0;background:transparent;color:var(--head-muted);font-weight:600;font-size:14px;padding:13px 6px 12px;border-bottom:3px solid transparent;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.tab .n{font-size:11.5px;font-weight:700;background:rgba(255,255,255,.12);color:var(--head-ink);padding:2px 7px;border-radius:99px;font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{color:var(--head-ink);border-bottom-color:var(--gold)}
.tab[aria-selected="true"] .n{background:var(--gold);color:#1B1505}
.tab .sm{display:none}
@media (max-width:440px){.tab .lg{display:none}.tab .sm{display:inline}.tab{gap:5px;font-size:13.5px}}
@media (max-width:560px){.tabs .wrap{overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain}.tabs .wrap::-webkit-scrollbar{display:none}.tab{flex:0 0 auto;padding-inline:12px}}
.tabs .tbar{height:3px;background:rgba(255,255,255,.06)}
.tabs .tbar i{display:block;height:100%;width:0;background:var(--ok-bar);transition:width .35s ease}

/* ---------- controles ---------- */
main{padding-top:16px;padding-bottom:calc(56px + env(safe-area-inset-bottom,0px))}
.ctl{display:flex;flex-direction:column;gap:10px}
.lbl{font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0}
.win{display:flex;gap:8px;align-items:stretch}
.ib{flex:none;width:44px;min-height:48px;border:1px solid var(--line);background:var(--surface);border-radius:12px;font-size:20px;line-height:1;color:var(--ink)}
.ib:hover{border-color:var(--faint)}
.dt{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:1px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:5px 10px;min-height:48px;cursor:pointer}
.dt:focus-within{border-color:var(--gold)}
.dt span{font-size:11px;color:var(--muted);font-weight:600}
.dt input{border:0;background:transparent;padding:0;min-width:0;width:100%;font-weight:600;font-size:14.5px;font-variant-numeric:tabular-nums;cursor:pointer;outline:0}
.dt input::-webkit-calendar-picker-indicator{display:none}
.dt input::-webkit-date-and-time-value{text-align:left}
/* segmentado, igual às chaves de marca e formato do Design System */
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:4px;background:var(--soft);padding:4px;border-radius:13px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;border-radius:10px;padding:6px 4px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--muted);min-width:0}
.seg b{font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap}
.seg small{font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow)}
.seg button[aria-pressed="true"] small{color:var(--ink)}
.reset{align-self:flex-start;border:0;background:none;padding:2px 0;color:var(--accent);font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:600;font-size:13px;padding:8px 13px;border-radius:99px;min-height:38px;display:inline-flex;align-items:center;gap:7px}
.chip:hover{border-color:var(--faint);color:var(--ink)}
.chip .d{width:8px;height:8px;border-radius:50%;flex:none}
.chip .c{font-size:11.5px;font-weight:700;color:var(--faint);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] .c{color:inherit;opacity:.7}
.intro{margin:16px 0 0;font-size:14px;color:var(--muted);line-height:1.55;text-wrap:pretty}

/* ---------- avisos ---------- */
.note{margin-top:14px;background:var(--warn-bg);color:var(--warn-fg);border-radius:12px;font-size:13.5px}
.note summary{list-style:none;cursor:pointer;padding:11px 40px 11px 14px;position:relative;line-height:1.45}
.note summary::-webkit-details-marker{display:none}
.note summary::after{content:"+";position:absolute;right:14px;top:9px;font-size:20px;font-weight:500;opacity:.8}
.note[open] summary::after{content:"–"}
.note .in{padding:0 14px 12px}
.note p{margin:0 0 8px}
.note h4{margin:12px 0 4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.note ul{margin:0;padding:0;list-style:none}
.note li{padding:7px 0;border-top:1px solid rgba(90,67,6,.14);display:flex;flex-direction:column;gap:2px}
.note li b{font-weight:600}
.note li span{font-variant-numeric:tabular-nums;opacity:.9}
.note code{font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;background:rgba(90,67,6,.1);padding:2px 5px;border-radius:5px}

/* ---------- zonas e setups ---------- */
.zone{margin-top:24px}
.zone>h2{margin:0 0 10px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:8px;color:var(--ink)}
.zone>h2 .d{width:10px;height:10px;border-radius:50%}
.zone>h2 small{margin-left:auto;font-size:12px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--muted);font-variant-numeric:tabular-nums}
.setup{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow)}
.sh{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;padding:14px 14px 13px 16px;position:relative}
.sh::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.sh .t{flex:1;min-width:0}
.sh h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:17px;line-height:1.25;letter-spacing:-.005em}
.sh p{margin:4px 0 0;font-size:13px;color:var(--muted);line-height:1.45}
.sh .cnt{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px;padding-top:2px}
.sh .cnt b{font-size:14px;font-variant-numeric:tabular-nums}
.sh .cnt b small{font-size:12px;color:var(--muted);font-weight:600}
.sh .cnt .mb{width:56px;height:4px;border-radius:99px;background:var(--line-2);overflow:hidden}
.sh .cnt .mb i{display:block;height:100%;background:var(--ok)}
.sh .chev{flex:none;width:20px;height:20px;margin-top:2px;color:var(--faint);transition:transform .2s}
.setup.closed .chev{transform:rotate(-90deg)}
.setup.closed .list,.setup.closed .pf,.setup.closed .takes{display:none}
.setup.full .cnt b{color:var(--ok)}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}

/* ---------- vídeo ---------- */
.item{display:flex;gap:2px;padding:12px 12px 12px 4px;border-top:1px solid var(--line-2)}
.item:first-child{border-top:0}
.ck{flex:none;width:42px;height:44px;display:grid;place-items:center;cursor:pointer;margin-top:-8px}
.ck input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.ck span{width:24px;height:24px;border:2px solid var(--faint);border-radius:7px;background:var(--surface);display:grid;place-items:center;transition:background .15s,border-color .15s}
.ck span::after{content:"";width:6px;height:11px;border:solid transparent;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ck input:checked+span{background:var(--ok);border-color:var(--ok)}
.ck input:checked+span::after{border-color:#fff}
.ck input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px}
.item .body{flex:1;min-width:0}
.tt{font-weight:600;font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.item.done{background:var(--ok-soft)}
.item.done .tt{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 8px;border-radius:7px;background:var(--soft);color:var(--ink);line-height:1.2;font-variant-numeric:tabular-nums}
.tag i{width:7px;height:7px;border-radius:50%;flex:none;background:currentColor}
.tag.t{background:var(--topo-soft);color:var(--topo-ink)}.tag.t i{background:var(--topo)}
.tag.m{background:var(--meio-soft);color:var(--meio-ink)}.tag.m i{background:var(--meio)}
.tag.f{background:var(--fundo-soft);color:var(--fundo-ink)}.tag.f i{background:var(--fundo)}
.tag.out{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.tag.out i{background:var(--faint)}
.tag.both{background:var(--both-soft);color:var(--both)}
.tag.dur{background:transparent;border:1px solid var(--line);color:var(--muted)}
.tag.code{background:transparent;color:var(--faint);font:600 11.5px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;padding-inline:2px}
.tag.diff{background:var(--warn-bg);color:var(--warn-fg)}
.tag.rel{background:var(--meio-soft);color:var(--meio-ink)}
/* aba Agenda: horário de cada vídeo no dia de gravação */
.hr{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:3px;font-size:12.5px;color:var(--muted)}
.hr b{font-size:15px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.hr .res{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--soft);color:var(--muted)}
.hr .urg{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--warn-bg);color:var(--warn-fg)}
.obs{margin:6px 0 2px;font-size:13px;line-height:1.5;color:var(--ink)}
.onde{display:flex;gap:8px;align-items:flex-start;margin:6px 0 4px;font-size:13px;line-height:1.45;color:var(--ink)}
.onde b{flex:none;font-size:11.5px;font-weight:700;letter-spacing:.02em;padding:3px 8px;border-radius:7px;white-space:nowrap}
.onde.externo b{background:var(--ext-soft);color:var(--ext)}.onde.interno b{background:var(--int-soft);color:var(--int)}
.onde.flex b{background:var(--soft);color:var(--ink);border:1px dashed var(--line)}
.parada .sh h3 .quando{display:block;font-size:12.5px;font-weight:700;color:var(--gold-ink);font-variant-numeric:tabular-nums;margin-bottom:2px}
.dia .sh h3 .quando{display:block;font-size:12.5px;font-weight:700;color:var(--gold-ink);margin-bottom:2px}
.pf{padding:8px 16px 4px;font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line)}
.post{display:flex;gap:10px;align-items:flex-start;padding:9px 12px 9px 16px;border-top:1px solid var(--line-2)}
.pf+ul .post:first-child{border-top:0}
.post .h{flex:0 0 46px;font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.post .b{flex:1;min-width:0}
.post .t2{font-size:14px;line-height:1.35;color:var(--ink)}
.post .m2{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.post.reel{background:var(--soft)}
.post.reel .t2{font-weight:600}
.post.reel.done{background:var(--ok-soft)}
.post .ck{margin:-2px 0 0 -6px}
.st{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:7px;background:var(--warn-bg);color:var(--warn-fg)}
.post.done .st{background:transparent;color:var(--ok);border:1px solid var(--ok)}
.vd{display:flex;gap:10px;align-items:flex-start;padding:11px 14px 11px 16px;border-top:1px solid var(--line-2)}
.list .vd:first-child{border-top:0}
.vd .h{flex:0 0 48px;font-size:13.5px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;padding-top:2px}
.vd .b{flex:1;min-width:0}
.vd .t2{font-size:14.5px;font-weight:600;line-height:1.35;color:var(--ink)}
.vd .m2{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.vd.falta .t2{font-weight:500;color:var(--muted)}
.vd.falta .h{color:var(--faint)}
.vbt{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
.vbt a,.vbt button{font:600 13px/1 inherit;font-family:inherit;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;cursor:pointer}
.vbt a.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.vbt .vr{font-size:12px;color:var(--muted);font-weight:600;align-self:center}
.vplay{margin-top:10px;width:100%;max-width:300px;aspect-ratio:9/16;border-radius:12px;background:#000;display:block}
.takes{margin:0;padding:10px 16px 12px;border-top:1px solid var(--line);font-size:13px;line-height:1.5;color:var(--muted)}
.takes b{color:var(--ink)}
.difr{margin:0;padding:8px 10px;border-radius:8px;background:var(--meio-soft);color:var(--meio-ink);font-size:13.5px}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:9px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;min-height:38px;font-size:13px;font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:5px}
.btn:hover{border-color:var(--faint)}
.btn.tog{color:var(--accent);border-color:transparent;background:transparent;padding-left:0;padding-right:2px}
.btn.tog:hover{text-decoration:underline;text-underline-offset:3px}
.btn.tog svg{transition:transform .2s}
.btn.tog[aria-expanded="true"] svg{transform:rotate(180deg)}
.btn svg{width:15px;height:15px;flex:none}
.rot{margin-top:10px}
.rot .lb2{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.rot .rst{font-size:11.5px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--gold-ink)}
.rot .lnk{margin-left:auto;border:0;background:none;padding:4px 0;color:var(--accent);font-size:12.5px;font-weight:600;letter-spacing:0;text-transform:none;text-decoration:underline;text-underline-offset:3px}
.rtx{display:block;width:100%;min-height:96px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);padding:10px 12px;font:14.5px/1.55 var(--f-ui);overflow:hidden}
.rtx:focus{outline:none;border-color:var(--gold);background:var(--surface)}
.item.done .rtx{color:var(--muted)}

function loadScript(src){
  return new Promise(res=>{const s=document.createElement('script');s.src=src;s.onload=()=>res(true);s.onerror=()=>{s.remove();res(false);};document.head.appendChild(s);});
}
function lineValue(src,re){const m=re.exec(src);return m?m[1]:null;}
async function fromModule(f){
  const r=await fetch(f.html,{cache:'no-cache'});
  if(!r.ok)throw new Error(f.html+' respondeu '+r.status);
  const src=await r.text();
  if(f.chave==='calendario'){
    const items=lineValue(src,/^const ITEMS=(\{.*\});\s*$/m),plans=lineValue(src,/^const PLANS=(\{.*\});\s*$/m);
    const launch=lineValue(src,/^let LAUNCH='(\d{4}-\d{2}-\d{2})';/m);
    const defs=/^const DEFAULTS=(\{[\s\S]*?\n\});/m.exec(src);
    if(!items||!plans||!defs)throw new Error('não achei ITEMS, PLANS e DEFAULTS em '+f.html);
    return {LAUNCH:launch||'',DEFAULTS:Function('"use strict";return ('+defs[1]+');')(),ITEMS:JSON.parse(items),PLANS:JSON.parse(plans)};
  }
  const data=lineValue(src,/^const DATA=(\[.*\]);\s*$/m);
  if(!data)throw new Error('não achei DATA em '+f.html);
  return JSON.parse(data);
}
async function loadAll(){

  for(const f of FONTES){
    if(D[f.chave]){out[f.chave]=D[f.chave];continue;}
    origem='modulos';
    out[f.chave]=await fromModule(f);
  }
  out.releituras=D.releituras||null;
  out.agenda=D.agenda||null;
  out.videos=D.videos||null;
  out.trocas=D.trocas||null;
  out.estrategia=D.estrategia||null;
  return out;
}

let C=null,SC=null,JP=null,IDX={scale:new Map(),jp:new Map()};

/* Roteiros editados: no Cloudflare (/api/roteiros) quando existe; senão, neste aparelho. */
let ORIG={},EDIT={},REMOTO=false;const salvarT={};
function guardarOriginais(){ORIG={};['scale','jp'].forEach(p=>IDX[p].forEach((x,id)=>{ORIG[p+':'+id]=x.roteiro||'';}));}
/* quando o roteiro original abre com o gancho, o gancho acompanha a primeira frase do roteiro editado */
const primeiraLinha=t=>(String(t||'').split(/\n/).map(l=>l.trim()).filter(Boolean)[0]||'');
function ganchoSegue(k,x){
  if(x.hook0===undefined)x.hook0=x.hook||'';
  const o=primeiraLinha(ORIG[k]);
  if(x.hook0&&o&&o.replace(/\s+/g,' ')===String(x.hook0).trim().replace(/\s+/g,' '))x.hook=primeiraLinha(x.roteiro)||x.hook0;
}
function aplicarEdicoes(){Object.keys(EDIT).forEach(k=>{const [p,id]=k.split(':');const x=IDX[p]&&IDX[p].get(id);if(x){x.roteiro=EDIT[k].texto;ganchoSegue(k,x);}});}
async function carregarEdicoes(){
  try{const r=await fetch('/api/roteiros',{cache:'no-store'});if(r.ok&&/json/.test(r.headers.get('content-type')||'')){EDIT=await r.json();REMOTO=true;return;}}catch(e){}
  EDIT=lsGet('pg:roteiros',{});REMOTO=false;
}
function mudarRoteiro(k,texto){
  const [p,id]=k.split(':');const x=IDX[p]&&IDX[p].get(id);if(x){x.roteiro=texto;ganchoSegue(k,x);}
  const original=texto===ORIG[k];if(original)delete EDIT[k];else EDIT[k]={texto,em:Date.now()};
  const st=document.querySelector('.rst[data-rs="'+CSS.escape(k)+'"]');if(st)st.textContent='Salvando…';
  clearTimeout(salvarT[k]);salvarT[k]=setTimeout(async()=>{
    let ok=true;
    if(REMOTO){try{const r=await fetch('/api/roteiros',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({chave:k,texto:original?'':texto})});ok=r.ok;}catch(e){ok=false;}}
    else lsSet('pg:roteiros',EDIT);
    const s2=document.querySelector('.rst[data-rs="'+CSS.escape(k)+'"]');
    if(s2)s2.textContent=!ok?'Não salvou. Confira a internet.':original?'':(REMOTO?'Editado · salvo':'Editado · salvo neste aparelho');
    if(!ok)toast('Não deu pra salvar o roteiro. Confira a internet e tente de novo.');
  },900);
}

function aplicarReleituras(R){
  REL=new Map();SEPARA=new Set();
  if(!R||!Array.isArray(R.itens))return;
  R.itens.forEach(r=>{
    const src=IDX[r.perfil]&&IDX[r.perfil].get(r.id);if(!src)return;
    IDX[r.perfil].set(r.id,Object.assign({},src,{titulo:r.titulo,hook:r.hook,roteiro:r.roteiro,direcao:r.direcao,legenda:r.legenda,momento:null}));
    const k=(r.perfil==='scale'?'s:':'j:')+r.id;if(C.ITEMS[k])C.ITEMS[k]=Object.assign({},C.ITEMS[k],{t:r.titulo});
    REL.set(r.perfil+':'+r.id,r);
    if(r.original&&r.original.id)SEPARA.add(r.original.id);
  });
}
let VIDEOS=[],POSTS=[],OUTROS=[],LAUNCH='',AGENDA=null,ARQ=null,TROCAS=[],EST=null;

function calState(){
  let cfg={},docs={};
  try{cfg=JSON.parse(localStorage.getItem('cal-cfg')||'{}')||{};docs=JSON.parse(localStorage.getItem('cal-docs')||'{}')||{};}catch(e){}
  return {cfg,docs};
}
function buildPosts(){
  const {cfg,docs}=calState();
  const ITEMS=C.ITEMS,PLANS=C.PLANS;
  LAUNCH=(cfg.start&&PLANS[cfg.start.date])?cfg.start.date:(PLANS[C.LAUNCH]?C.LAUNCH:Object.keys(PLANS).sort()[0]);
  const PLAN=PLANS[LAUNCH]||{};
  const posts=[],outros=[];
  ['scale','jp'].forEach(p=>{
    const base=PLAN[p]||{},disc=(cfg['disc_'+p]&&cfg['disc_'+p].ids)||DISC0[p]||{},dates=Object.keys(base).sort();
    const D=C.DEFAULTS[p]||[];let sl=D;const c=cfg[p];
    if(c&&Array.isArray(c.slots)&&c.slots.length){if(c.v===2)sl=c.slots;else if(c.slots.length===D.length)sl=c.slots.map((s,i)=>({t:s.t,f:D[i].f}));}
    const stateOf=(d,i)=>{const w=docs[p+'_'+mondayOf(d)];return (w&&w.slots&&w.slots[d+'_'+i])||{};};
    const eff={};dates.forEach(d=>{eff[d]={s:base[d].s.slice(),x:base[d].x};});
    const cats={},taken={};
    dates.forEach(d=>base[d].s.forEach((k,i)=>{
      if(!k||!ITEMS[k]||k==='s:EP')return;
      const st=stateOf(d,i);
      if(st.st==='agendado'||st.st==='postado'){const pk=st.pk||k;eff[d].s[i]=pk;taken[pk]=1;return;}
      const it=ITEMS[k];if(it.p&&!disc[k]){taken[k]=1;return;}
      const cat=it.k+'|'+it.f;(cats[cat]=cats[cat]||[]).push({d,i,k});
    }));
    Object.keys(cats).forEach(c=>{const R=cats[c],q=R.map(x=>x.k).filter(k=>!disc[k]&&!taken[k]);R.forEach((x,n)=>{eff[x.d].s[x.i]=n<q.length?q[n]:null;});});
    /* trocas combinadas (dados/trocas.js): dois posts do mesmo perfil trocam de dia e horário */
    TROCAS.filter(t=>t.perfil===p).forEach(t=>{
      let pa=null,pb=null;
      dates.forEach(d=>eff[d].s.forEach((k,i)=>{if(k===t.a)pa=[d,i];if(k===t.b)pb=[d,i];}));
      if(pa&&pb){eff[pa[0]].s[pa[1]]=t.b;eff[pb[0]].s[pb[1]]=t.a;}
    });
    dates.forEach(d=>{
      const add=(k,hora,i)=>{const it=ITEMS[k];if(it&&it.k!=='Reel'){outros.push({perfil:p,date:d,hora,key:k,id:k.slice(2),titulo:it.t,funil:it.f,fmt:it.k});return;}if(!it)return;posts.push({perfil:p,date:d,hora,i,key:k,id:k.slice(2),titulo:it.t,funil:it.f});};
      sl.forEach((s,i)=>{const k=eff[d].s[i];if(k)add(k,s.t||'',i);});
      if(eff[d].x)add(eff[d].x,'extra',99);
    });
  });
  /* posts movidos (dados/trocas.js, itens com "mover"): o post vai para outro dia e horário, mesmo sem par */
  TROCAS.filter(t=>t.mover&&t.para).forEach(t=>{const p=posts.find(x=>x.perfil===t.perfil&&x.key===t.mover);if(p){p.date=t.para;if(t.hora)p.hora=t.hora;}});
  /* posts extras (dados/trocas.js, itens com "novo"): vídeo que não está no Calendário de Posts, como os cortes */
  TROCAS.filter(t=>t.novo&&t.para&&(t.perfil==='jp'||t.perfil==='scale')).forEach(t=>{const key=(t.perfil==='scale'?'s:':'j:')+t.novo;if(posts.some(x=>x.key===key))return;posts.push({perfil:t.perfil,date:t.para,hora:t.hora||'extra',i:90,key,id:t.novo,titulo:t.titulo||t.novo,funil:t.funil||'m'});});
  posts.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.hora<b.hora?-1:a.hora>b.hora?1:0));
  POSTS=posts;OUTROS=outros;
}

/* ---------- vídeos: um por gravação, juntando Scale e JP ---------- */
function srcOf(p,id){return IDX[p].get(id)||null;}
function scaleByTitle(){
  const m=new Map();
  Object.keys(C.ITEMS).forEach(k=>{if(k.charAt(0)!=='s'||C.ITEMS[k].k!=='Reel')return;const t=normTitle(C.ITEMS[k].t);m.set(t,m.has(t)?null:k.slice(2));});
  return m;
}
function buildVideos(){
  const byTitle=scaleByTitle(),map=new Map();
  POSTS.forEach(p=>{
    let vid;const rel=REL.get(p.perfil+':'+p.id);
    if(rel)vid='r:'+p.id;
    else if(p.perfil==='scale')vid='s:'+p.id;
    else if(SEPARA.has(p.id))vid='j:'+p.id;
    else{const s=MESMO_VIDEO[p.id]||byTitle.get(normTitle(p.titulo));vid=s?'s:'+s:'j:'+p.id;}
    p.vid=vid;
    let v=map.get(vid);
    if(!v){v={vid,posts:[],ids:{scale:[],jp:[]},rel:rel||null,temRel:SEPARA.has(p.id)};map.set(vid,v);}
    v.posts.push(p);
    if(v.ids[p.perfil].indexOf(p.id)<0)v.ids[p.perfil].push(p.id);
  });
  VIDEOS=[...map.values()];
  VIDEOS.forEach(prepVideo);
}
function prepVideo(v){
  /* um vídeo do JP ligado a um código do Scale que não posta no Scale nesse plano
     ainda usa o texto do Scale como referência, mas não conta como "nos dois perfis" */
  const scIds=v.ids.scale.length?v.ids.scale:(v.vid.charAt(0)==='s'?[v.vid.slice(2)]:[]);
  const sc=scIds.map(id=>srcOf('scale',id)).filter(Boolean);
  const jp=v.ids.jp.map(id=>srcOf('jp',id)).filter(Boolean);
  v.src={scale:sc[0]||null,jp:jp[0]||null};
  v.both=v.ids.scale.length>0&&v.ids.jp.length>0;
  /* direção: a do JP primeiro (é a que descreve a gravação em casa), depois a do Scale */
  v.dir=(v.src.jp&&v.src.jp.direcao)||(v.src.scale&&v.src.scale.direcao)||'';
  v.dur=duracao(v.dir)||duracao(v.src.scale&&v.src.scale.direcao);
  v.code=[...v.ids.scale.map(id=>'Scale '+id),...v.ids.jp.map(id=>'JP '+id)].join(' · ')+(v.rel?' · releitura '+v.rel.codigo:'');
  v.fin=(v.both&&v.src.scale&&v.src.jp)?finais(v.src.scale.roteiro,v.src.jp.roteiro):null;
  const a=autoSetup(v);v.auto=a.k;v.why=a.why;
}

/* ---------- setup ---------- */
const SERIES=['erro do dono','erro de gestão','clt do cnpj','pov: o cliente disse','dono que escala'];
function autoSetup(v){
  const ids=[...v.ids.scale,...v.ids.jp];
  if(v.rel&&SETUP_BY[v.rel.setup])return {k:v.rel.setup,why:'releitura do Scale. '+(v.rel.porque||'')};
  for(const id of [v.vid.slice(2),...ids])if(SETUP_POR_ID[id])return {k:SETUP_POR_ID[id],why:'classificado à mão na lista de 16 a 29/11'};
  const tits=v.posts.map(p=>N(p.titulo));
  const dir=N([v.src.jp&&v.src.jp.direcao,v.src.scale&&v.src.scale.direcao].filter(Boolean).join('\n'));
  const cen=v.src.jp&&v.src.jp.momento&&v.src.jp.momento.cenario;
  const starts=list=>list.find(s=>tits.some(t=>t.indexOf(N(s))===0));
  let w;
  if(starts(['black friday #']))return {k:'shopping',why:'título “Black Friday #”'};
  if((w=has(dir,['poltrona','voz fora da câmera'])))return {k:'poltrona',why:'direção cita “'+w+'”'};
  if((w=has(dir,['tatame','kimono'])))return {k:'tatame',why:'direção cita “'+w+'”'};
  if(cen==='treino')return {k:'tatame',why:'momento do JP: treino'};
  if((w=has(dir,['externo','praia','rua'])))return {k:'praia',why:'direção cita “'+w+'”'};
  if(cen==='praia')return {k:'praia',why:'momento do JP: praia'};
  if(cen==='cafe')return {k:'cafe',why:'momento do JP: café'};
  if((w=has(dir,['notebook','gravação de tela','gravar a tela'])))return {k:'notebook',why:'direção cita “'+w+'”'};
  if(starts(['recado #']))return {k:'varanda',why:'série Recado'};
  if(starts(SERIES))return {k:'serie',why:'título de série'};
  if((w=has(dir,['caderno','quadro','bloco de papel'])))return {k:'caderno',why:'direção cita “'+w+'”'};
  return {k:'cafe',why:'fala direta, sem objeto na direção: vai bem numa cafeteria'};
}

/* ---------- textos derivados da direção e do roteiro ---------- */
function duracao(dir){
  if(!dir)return '';
  let m=/Dura[çc][ãa]o:\s*([^.\n]+)/i.exec(dir);
  if(!m)m=/(?:^|[\s.,;:])(\d{1,3}(?:\s*a\s*\d{1,3})?\s*(?:s|seg|segundos))(?=[\s.,;)]|$)/i.exec(dir);
  return m?m[1].replace(/\s*(segundos|seg)\b/i,' s').replace(/\s+/g,' ').trim():'';
}
function resumo(dir){
  if(!dir)return '';
  let p=dir.split(/\n\s*\n/)[0];
  p=p.replace(/^Cen[áa]rio:\s*/i,'').replace(/\s*Dura[çc][ãa]o:\s*[^.]+\.\s*/i,' ');
  p=p.replace(/(^|[.:]\s+)\d{1,3}(?:\s*a\s*\d{1,3})?\s*(?:s|seg|segundos)\.\s*/i,'$1');
  p=p.replace(/\s+/g,' ').trim();
  if(p.length>340){const cut=p.lastIndexOf('. ',330);p=cut>120?p.slice(0,cut+1):p.slice(0,330)+'…';}
  return p.charAt(0).toUpperCase()+p.slice(1);
}
const linhas=s=>String(s||'').split('\n').map(l=>l.trim()).filter(Boolean);
function finais(rs,rj){
  const A=linhas(rs),B=linhas(rj);if(!A.length||!B.length)return null;
  let i=0;while(i<A.length&&i<B.length&&normTitle(A[i])===normTitle(B[i]))i++;
  let j=0;while(j<A.length-i&&j<B.length-i&&normTitle(A[A.length-1-j])===normTitle(B[B.length-1-j]))j++;
  const a=A.slice(i,A.length-j),b=B.slice(i,B.length-j);
  if(!a.length&&!b.length)return null;
  const wa=new Set(normTitle(a.join(' ')).split(' ').filter(Boolean)),wb=new Set(normTitle(b.join(' ')).split(' ').filter(Boolean));
  let inter=0;wa.forEach(w=>{if(wb.has(w))inter++;});
  const uni=wa.size+wb.size-inter;
  if(uni&&inter/uni>=.75)return null; /* só troca de palavra (“esse”/“este”) */
  return {scale:a.join('\n'),jp:b.join('\n'),fim:j===0};
}

/* "Gravado" fica no Cloudflare (/api/gravados): marcou num aparelho, aparece em todos. Este aparelho guarda uma cópia para abrir sem internet. */
let FEITO_REMOTO=false;
async function enviarFeitos(liga,desliga){
  if(!FEITO_REMOTO){toast('Sem conexão com o servidor: a marcação ficou só neste aparelho por enquanto.');return;}
  try{const r=await fetch('/api/gravados',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({liga,desliga})});if(!r.ok)throw 0;FEITO=await r.json();lsSet(K.feito,FEITO);}
  catch(e){toast('Não deu pra salvar a marcação. Confira a internet e marque de novo.');}
}
async function carregarFeitos(){
  try{
    const r=await fetch('/api/gravados',{cache:'no-store'});if(!r.ok||!/json/.test(r.headers.get('content-type')||''))throw 0;
    let rem=await r.json();FEITO_REMOTO=true;
    /* primeira vez em cada aparelho: o que estava marcado só aqui sobe para todos */
    if(!lsGet('pg:gravado-sync',false)){
      const loc=lsGet(K.feito,{}),falta={};Object.keys(loc).forEach(k=>{if(!(k in rem)&&/^[A-Za-z0-9:_.-]{1,48}$/.test(k))falta[k]=loc[k];});
      if(Object.keys(falta).length){const r2=await fetch('/api/gravados',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({liga:falta,desliga:[]})});if(!r2.ok)throw 0;rem=await r2.json();}
      lsSet('pg:gravado-sync',true);
    }
    const mudou=JSON.stringify(rem)!==JSON.stringify(FEITO);FEITO=rem;lsSet(K.feito,FEITO);return mudou;
  }catch(e){return false;}
}

/* ---------- onde dá pra gravar: cada conteúdo tem uma lista de lugares (o primeiro é o ideal) ---------- */
const LUGARES=[

  {k:'academia',nome:'Academia',ext:true},{k:'shopping',nome:'Shopping',ext:true},{k:'varanda',nome:'Varanda',ext:false}];
const LUG_BY=Object.fromEntries(LUGARES.map(l=>[l.k,l]));
/* pelo que o conteúdo precisa (setup): ideal primeiro, depois os que também servem */
const LUG_POR_SETUP={
  notebook:['escritorio','cafeteria','sala'],
  caderno:['escritorio','cafeteria','restaurante','sala'],
  poltrona:['sala','carro','escritorio','cafeteria','restaurante'],
  cafe:['cafeteria','rua','carro','restaurante','academia','escritorio'],
  praia:['rua','carro','cafeteria'],
  shopping:['shopping','rua'],
  tatame:['academia'],
  serie:['escritorio'],quadro:['escritorio'],varanda:['varanda']};
const LUG_POR_QUE={
  notebook:'precisa da tela do notebook',caderno:'ele escreve enquanto fala',poltrona:'alguém lê as perguntas fora da câmera',
  cafe:'fala direta, sem objeto',praia:'fala direta, em movimento',shopping:'tema de compras e lojas',tatame:'precisa do tatame e do kimono',
  serie:'série com cenário fixo',quadro:'série com o quadro fixo',varanda:'série Recado, sempre na varanda'};
const setupLugar=v=>v.posts.some(p=>/^(isso ou aquilo|bate-bola)/i.test(N(p.titulo)))?'poltrona':setupOf(v);  /* Isso ou aquilo: precisa de alguém lendo as perguntas */
function lugaresDe(v){
  let k=setupLugar(v);
  const base=(LUG_POR_SETUP[k]||['cafeteria','escritorio']).slice();
  if(['serie','quadro','varanda','tatame'].includes(k))return base;  /* cenário fixo não muda pelo tema */
  const r=rotDe(v).txt,t=N(v.posts.map(p=>p.titulo).join(' ')+' '+r);

  if(k!=='notebook'&&k!=='caderno'){
    puxa('academia',['academia','treino','acordar cedo','disciplina','rotina','jiu','tatame']);
    puxa('restaurante',['restaurante','cardápio','cardapio','garçom','garcom','delivery','pizzaria']);

/* ---------- aba Sessão: o conteúdo se encaixa na rotina ---------- */
/* dias e horários fixos de gravação (getUTCDay: 1 = segunda) */
const SESSOES={1:'13:30',2:'08:30',3:'13:30',4:'08:30',5:'08:30'};
let SES=lsGet('pg:sessao',{}),FRASES=lsGet('pg:frases',{});
const sesSalvar=()=>{lsSet('pg:sessao',SES);};
function proximasSessoes(n){
  const out=[],agora=new Date(),hoje=today();
  for(let k=0;out.length<n&&k<21;k++){
    const d=addDays(hoje,k),wd=parse(d).getUTCDay(),h=SESSOES[wd];if(!h)continue;
    if(k===0){const [hh,mm]=h.split(':').map(Number);if(agora.getHours()*60+agora.getMinutes()>hh*60+mm+240)continue;}  /* sessão de hoje some 4 h depois do início */
    out.push({d,h});
  }

}
/* roteiro que se lê na gravação: o do perfil do próximo post */
function rotDe(v,perfil){
  const rp=perfil||(v.src.jp?'jp':'scale'),rid=(v.ids[rp]&&v.ids[rp][0])||(rp==='scale'&&/^[sr]:/.test(v.vid)?v.vid.slice(2):null);
  const rk=rid?rp+':'+rid:null;return {rk,txt:rid&&IDX[rp].get(rid)?IDX[rp].get(rid).roteiro||'':''};
}
function frasesDe(txt){

}
/* o que falta gravar: só vídeos com post de hoje em diante, do mais urgente para o menos */

    const card=q=>`<li class="pc ${q.e}"><div class="mt"><span class="hr">${esc(q.h)}</span><span class="tag ${EST_ETAPA[q.e]}"><i></i>${esc(q.e)}</span><span class="tag dur">${esc(q.f)}</span><span class="ps">${esc(q.p)} · ${esc(q.s)}</span></div><b class="tt">${esc(q.t)}</b><p><span class="lb">Gancho</span>${estTxt(q.g)}</p><p class="rt"><span class="lb">Roteiro</span>${estTxt(q.r||q.x||'')}</p><p><span class="lb">CTA</span>${estTxt(q.c)}</p></li>`;

  if(t.dataset.tab){UI.tab=t.dataset.tab;render();return;}
  if(t.dataset.estf){const box=t.closest('.est-mes');box.dataset.f=t.dataset.estf;box.querySelectorAll('[data-estf]').forEach(x=>x.setAttribute('aria-pressed',String(x===t)));if(t.dataset.estf!=='todos')box.querySelectorAll('details').forEach(x=>{x.open=true;});return;}
  if(t.dataset.est){const k=t.dataset.est,sec=t.closest('.setup');const c=!sec.classList.contains('closed');sec.classList.toggle('closed',c);t.setAttribute('aria-expanded',String(!c));if(c)opened.delete(k);else opened.add(k);UI.open=[...opened];saveUI();return;}
  if(t.dataset.estgo){const k='est-'+t.dataset.estgo,sec=$(k);if(sec){if(sec.classList.contains('closed')){sec.classList.remove('closed');sec.querySelector('.sh').setAttribute('aria-expanded','true');opened.add(k);UI.open=[...opened];saveUI();}sec.scrollIntoView({behavior:'smooth',block:'start'});}return;}
  if(t.dataset.vdia){const k=t.dataset.vdia,sec=t.closest('.setup');const c=!sec.classList.contains('closed');sec.classList.toggle('closed',c);t.setAttribute('aria-expanded',String(!c));if(c)opened.delete(k);else opened.add(k);UI.open=[...opened];UI.vidMexeu=true;saveUI();return;}
  if(t.dataset.assistir){const b=t.closest('.b');let v=b.querySelector('video');if(v){v.pause();v.remove();t.textContent='▶ Assistir';return;}
    v=document.createElement('video');v.className='vplay';v.src=t.dataset.assistir;v.controls=true;v.playsInline=true;v.preload='metadata';b.appendChild(v);v.play().catch(()=>{});t.textContent='✕ Fechar';return;}
  if(t.dataset.dia){const k=t.dataset.dia,sec=t.closest('.setup');const c=!sec.classList.contains('closed');sec.classList.toggle('closed',c);t.setAttribute('aria-expanded',String(!c));if(c)opened.delete(k);else opened.add(k);UI.open=[...opened];UI.diasMexeu=true;saveUI();return;}
  if(t.dataset.week){UI.week=t.dataset.week;render();return;}
  if(t.dataset.loc){UI.loc=t.dataset.loc;render();return;}
  if(t.dataset.shift){const n=+t.dataset.shift;setWindow(addDays(UI.a,n),addDays(UI.b,n));return;}
  if(t.id==='reset'){const d=defaultWindow();setWindow(d.a,d.b);return;}
  if(t.dataset.sh){const k=t.dataset.sh,sec=t.closest('.setup');const c=!sec.classList.contains('closed');sec.classList.toggle('closed',c);t.setAttribute('aria-expanded',String(!c));if(c)closed.add(k);else closed.delete(k);UI.closed=[...closed];saveUI();return;}
  if(t.dataset.tog){
    const id=t.dataset.tog,m=(t.closest('.item')&&t.closest('.item').querySelector('.more'))||document.getElementById('m-'+id);const o=m.hidden;m.hidden=!o;
    t.setAttribute('aria-expanded',String(o));t.querySelector('span').textContent=o?'Fechar':'Ver gancho e cenário';
    if(o)opened.add(id);else opened.delete(id);UI.open=[...opened];saveUI();return;
  }
  if(t.dataset.copy){
    const v=byVid.get(t.dataset.v),s=v&&v.src[t.dataset.copy];
    if(!s||!s.roteiro){toast('Esse vídeo não tem roteiro na Central.');return;}
    toast(await copyText(s.roteiro)?'Roteiro '+PERFIS[t.dataset.copy]+' copiado':'Não deu pra copiar. Tente de novo.');
  }
});
document.addEventListener('input',e=>{
  const t=e.target;if(!t.dataset||!t.dataset.rot)return;ajustarAltura(t);mudarRoteiro(t.dataset.rot,t.value);
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-rest]');if(!b)return;const k=b.dataset.rest;
  const t=document.querySelector('.rtx[data-rot="'+CSS.escape(k)+'"]');if(t){t.value=ORIG[k]||'';ajustarAltura(t);}
  mudarRoteiro(k,ORIG[k]||'');b.remove();toast('Roteiro voltou ao original da Central');
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.ck){
    const v=byVid.get(t.dataset.ck);if(!v)return;
    setDone(v,t.checked);
    /* atualiza só o card, os contadores do setup e o topo: a lista não pula */
    const li=t.closest('.item');li.classList.toggle('done',t.checked);
    const sec=t.closest('.setup');
    if(sec){
      const vs=[...sec.querySelectorAll('.item')].map(x=>byVid.get(x.dataset.v)),ok=vs.filter(isDone).length;
      sec.querySelector('.cnt b').innerHTML=ok+'<small> / '+vs.length+'</small>';
      sec.querySelector('.cnt .mb i').style.width=Math.round(ok/vs.length*100)+'%';
      sec.classList.toggle('full',ok===vs.length);
      const z=sec.closest('.zone'),zv=[...z.querySelectorAll('.item')].map(x=>byVid.get(x.dataset.v));
      z.querySelector('h2 small').textContent=zv.filter(isDone).length+' de '+zv.length+' gravados';
    }
    if(UI.tab==='dias'){render();return;}
    renderProgress();
    return;
  }
  if(t.dataset.setup){
    const v=byVid.get(t.dataset.setup);if(!v)return;
    if(t.value===v.auto)delete MANUAL[v.vid];else MANUAL[v.vid]=t.value;
    lsSet(K.setup,MANUAL);opened.add(v.vid);UI.open=[...opened];
    closed.delete(t.value);UI.closed=[...closed];
    render();
    toast('Movido para '+SETUP_BY[t.value].nome);
    const li=document.querySelector('.item[data-v="'+CSS.escape(v.vid)+'"]');
    if(li)li.scrollIntoView({block:'center',behavior:'smooth'});
    return;
  }
  if(t.id==='dA'){if(!isDate(t.value))return;const span=diffDays(UI.b,UI.a);setWindow(t.value,addDays(t.value,span));return;}
  if(t.id==='dB'){if(!isDate(t.value))return;setWindow(UI.a,t.value);return;}
});
/* no computador, clicar em qualquer parte do campo abre o calendário do navegador
   (no celular o toque já abre o seletor nativo) */
document.querySelectorAll('.dt').forEach(l=>l.addEventListener('click',()=>{
  const i=l.querySelector('input');
  if(i.showPicker&&window.matchMedia('(pointer:fine)').matches){try{i.showPicker();}catch(e){}}
}));
/* outra aba ou o Calendário (aberto ao lado, na Central) mudou algo: refaz */
window.addEventListener('storage',e=>{
  if(!C)return;
  if(e.key===K.feito){FEITO=lsGet(K.feito,{});render();}
  else if(e.key===K.setup){MANUAL=lsGet(K.setup,{});render();}
  else if(e.key==='cal-cfg'||e.key==='cal-docs'){buildPosts();buildVideos();render();}
});

/* =====================================================================
   8. Início
   ===================================================================== */
async function init(){
  try{
    const d=await loadAll();
    C=d.calendario;SC=d.scale;JP=d.jp;
    IDX={scale:new Map(SC.map(x=>[x.id,x])),jp:new Map(JP.map(x=>[x.id,x]))};
    aplicarReleituras(d.releituras);AGENDA=d.agenda&&Array.isArray(d.agenda.paradas)?d.agenda:null;ARQ=d.videos&&d.videos.itens?d.videos:null;TROCAS=(d.trocas&&Array.isArray(d.trocas.itens))?d.trocas.itens:[];EST=d.estrategia&&Array.isArray(d.estrategia.secoes)?d.estrategia:null;
    guardarOriginais();await Promise.all([carregarEdicoes(),carregarFeitos(),carregarPlanos()]);aplicarEdicoes();
    buildPosts();buildVideos();render();
  }catch(err){
    console.error(err);
    $('sub').textContent='Não deu pra carregar os dados.';
    $('out').innerHTML=`<div class="err"><b>Não carreguei os Reels.</b><br>Confira a conexão e se a pasta dados/ (ou os módulos Calendário de Posts, Central Scale e Central do JP) estão publicados.<br><small>${esc(err.message||err)}</small><br><button class="btn" type="button" onclick="location.reload()">Tentar de novo</button></div>`;
  }
}
init();
})();
</script>
